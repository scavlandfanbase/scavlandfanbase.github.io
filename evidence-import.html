<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence Library Import | SCAVLAND</title><link rel="stylesheet" href="site-theme.css">
<style>main{width:min(900px,calc(100% - 28px));margin:40px auto}.panel{background:var(--scav-panel);border:1px solid var(--scav-line);padding:18px;border-radius:6px;margin:14px 0}.btn{padding:10px 14px;border:1px solid var(--scav-gold-bright);background:#171713;color:var(--scav-gold-bright);border-radius:4px;cursor:pointer}input{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0;background:#111412;color:#eee;border:1px solid #484b45}.hidden{display:none}.status{white-space:pre-wrap;color:var(--scav-muted)}progress{width:100%;height:22px}</style></head>
<body><main><h1>Evidence Library Import</h1>
<section id="login" class="panel"><h2>Admin sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign in</button><p id="loginStatus" class="status"></p></section>
<section id="importer" class="panel hidden"><h2>Bulk import screenshots</h2><p>Select the raw screenshot files. Originals in GitHub are not changed. Files are copied to the permanent <code>evidence-library</code> bucket using their current filename.</p>
<input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple><button id="upload" class="btn">Upload selected files</button>
<p><progress id="progress" value="0" max="1"></progress></p><p id="status" class="status">Ready.</p></section></main>
<script>
const SB='https://demtoqsafufzmnhvaykj.supabase.co',KEY='sb_publishable_0kdLCpTy7Sf8BKkIU5TOqw_Qaay4gzH';
let token='';const $=id=>document.getElementById(id);
async function signin(){ $('loginStatus').textContent='Signing in…';const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok){$('loginStatus').textContent=d.msg||d.message||'Sign-in failed';return}token=d.access_token;const t=await fetch(SB+'/rest/v1/rpc/is_scavland_admin',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}'});if(!t.ok||await t.json()!==true){$('loginStatus').textContent='This account is not authorized as a SCAVLAND admin.';return}$('login').classList.add('hidden');$('importer').classList.remove('hidden')}
function safeName(n){return n.normalize('NFKD').replace(/[^A-Za-z0-9._ -]/g,'').replace(/\s+/g,' ').trim()}
async function uploadOne(file){const path='raw/'+safeName(file.name);return fetch(SB+'/storage/v1/object/evidence-library/'+encodeURIComponent(path).replace(/%2F/g,'/'),{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},body:file})}
async function uploadAll(){const files=[...$('files').files];if(!files.length){$('status').textContent='Choose files first.';return}if(!confirm('Upload '+files.length+' screenshots to the permanent evidence library?'))return;$('upload').disabled=true;$('progress').max=files.length;$('progress').value=0;let ok=0,fail=[];for(let i=0;i<files.length;i++){const r=await uploadOne(files[i]);if(r.ok)ok++;else fail.push(files[i].name+' — '+await r.text());$('progress').value=i+1;$('status').textContent='Uploaded '+ok+' / '+files.length+(fail.length?'\nFailed: '+fail.length:'')} $('upload').disabled=false;if(fail.length)$('status').textContent+='\n\n'+fail.slice(0,20).join('\n');else $('status').textContent+='\nComplete.'}
$('signin').onclick=signin;$('upload').onclick=uploadAll;
</script></body></html>
