<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Review | SCAVLAND</title><link rel="stylesheet" href="site-theme.css"><link rel="stylesheet" href="evidence-review.css?v=evidence-review-20261001-1"></head><body><main><h1>Evidence Review</h1><p>Review submissions privately. Approval does not verify an item or publish game information. Submissions and review history are retained.</p><p id="status" role="status" aria-live="polite">Open Evidence Review through the Admin Hub.</p><section id="workspace" hidden><label>Submission status<select id="filter"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></label><button id="refresh">Refresh queue</button><div class="columns"><nav aria-label="Evidence submissions"><div id="records"></div><button id="more" hidden>Show more</button></nav><section id="detail" hidden><h2 id="name" tabindex="-1"></h2><p id="metadata"></p><p id="submission-notes"></p><img id="screenshot" hidden alt="Submitted evidence screenshot"><p id="image-status"></p><label>Review notes<textarea id="notes" maxlength="4000"></textarea></label><div class="actions"><button id="approve">Approve submission</button><button id="reject">Reject submission</button><button id="restore">Restore to pending</button><button id="retry" hidden>Retry same decision</button><button id="reload">Review saved state</button></div><h3>Review history</h3><p id="history-empty"></p><ol id="history"></ol></section></div></section></main><script src="evidence-review.js?v=evidence-review-20261001-1"></script></body></html>
