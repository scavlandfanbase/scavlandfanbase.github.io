<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence Review | SCAVLAND</title><link rel="stylesheet" href="site-theme.css">
<style>
.admin-main{width:min(1200px,calc(100% - 28px));margin:40px auto 70px}.admin-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.admin-head h1{color:var(--scav-gold-bright)}.panel,.card{background:var(--scav-panel);border:1px solid var(--scav-line);border-radius:6px;padding:16px}.login{max-width:520px;margin:30px auto}.login input{width:100%;box-sizing:border-box;padding:11px;margin:7px 0;background:#111412;color:#eee;border:1px solid #484b45;border-radius:4px}.btn{padding:9px 13px;border:1px solid var(--scav-gold-bright);background:#171713;color:var(--scav-gold-bright);border-radius:4px;cursor:pointer}.btn:hover{background:var(--scav-gold-bright);color:#171713}.danger{border-color:#a65f5f;color:#f0b4b4}.cards{display:grid;gap:14px;margin-top:18px}.card-grid{display:grid;grid-template-columns:minmax(240px,420px) 1fr;gap:18px}.shot{width:100%;max-height:360px;object-fit:contain;background:#090a09;border:1px solid #343632}.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 12px}.meta b{color:var(--scav-gold-bright)}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tab.active{background:var(--scav-gold-bright);color:#171713}.shot{cursor:zoom-in}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px}.lightbox.hidden{display:none}.lightbox img{max-width:96vw;max-height:92vh;object-fit:contain}.lightbox button{position:absolute;top:18px;right:18px}.status{color:var(--scav-muted)}.hidden{display:none}@media(max-width:720px){.card-grid{grid-template-columns:1fr}}
</style><style>.admin-tabs{display:flex;gap:8px;margin:18px 0}.admin-tabs .active{background:var(--scav-gold-bright);color:#171713}.item-frame{width:100%;min-height:900px;border:0;background:transparent}</style></head><body><main class="admin-main"><div class="admin-head"><h1>Evidence Review</h1><button id="logout" class="btn hidden">Sign out</button></div>
<section id="login" class="panel login"><h2>Admin sign in</h2><p>Authorized reviewers only.</p><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="btn">Sign in</button> <button id="forgot" class="btn" type="button">Reset password</button><p id="login-status" class="status"></p><div id="reset-box" class="hidden"><h3>Set a new password</h3><input id="new-password" type="password" autocomplete="new-password" minlength="10" placeholder="New password"><button id="save-password" class="btn" type="button">Save new password</button><p id="reset-status" class="status"></p></div></section>
<div id="admin-tabs" class="admin-tabs hidden"><button id="evidence-tab" class="btn active" type="button">Evidence review</button><button id="items-tab" class="btn" type="button">Item editor</button></div><section id="review" class="hidden"><div class="panel"><strong>Evidence submissions</strong> <span id="count" class="status"></span><div class="tabs"><button class="btn tab active" data-status="pending">Pending</button><button class="btn tab" data-status="approved">Approved</button><button class="btn tab" data-status="rejected">Rejected</button><button id="clear-rejected" class="btn danger hidden" type="button">Clear Rejected</button></div></div><div id="cards" class="cards"></div></section><section id="items-panel" class="hidden"><iframe id="items-frame" class="item-frame" src="items-admin.html?embed=1" title="Item editor"></iframe></section></main><div id="lightbox" class="lightbox hidden"><button id="close-lightbox" class="btn">Close</button><img id="lightbox-image" alt="Evidence screenshot"></div>
<script>
const SB_URL='https://demtoqsafufzmnhvaykj.supabase.co',KEY='sb_publishable_0kdLCpTy7Sf8BKkIU5TOqw_Qaay4gzH';
const $=id=>document.getElementById(id), statusEl=$('login-status'), login=$('login'),review=$('review'),cards=$('cards');
const headers={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
let accessToken=null,currentStatus='pending';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,opt={}){return fetch(SB_URL+path,{...opt,headers:{...headers,...(opt.headers||{})}})}
async function signIn(){
 statusEl.textContent='Signing in…';
 const r=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});
 const d=await r.json(); if(!r.ok){statusEl.textContent=(d.error_description||d.msg||d.message||'Sign-in failed.');return}
 accessToken=d.access_token;statusEl.textContent='Signed in. Loading admin review…';await load();
}
async function resetPassword(){
 const email=$('email').value.trim();if(!email){statusEl.textContent='Enter your admin email first.';return}
 statusEl.textContent='Sending password reset email…';
 const r=await api('/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:JSON.stringify({email})});
 if(r.ok)statusEl.textContent='Password reset email sent. Open the newest email.';else{const d=await r.json();statusEl.textContent=d.msg||d.message||'Could not send reset email.'}
}
async function load(){
 const h={...headers,Authorization:'Bearer '+accessToken};
 const r=await fetch(SB_URL+'/rest/v1/evidence_submissions?status=eq.'+encodeURIComponent(currentStatus)+'&order=created_at.desc',{headers:h});
 if(!r.ok){statusEl.textContent='Signed in, but this account is not authorized as a SCAVLAND admin.';return}
 const data=await r.json();$('clear-rejected').classList.toggle('hidden',currentStatus!=='rejected'||data.length===0);login.classList.add('hidden');review.classList.remove('hidden');$('admin-tabs').classList.remove('hidden');$('logout').classList.remove('hidden');$('count').textContent='— '+currentStatus.charAt(0).toUpperCase()+currentStatus.slice(1)+' ('+data.length+')';cards.innerHTML='';
 for(const x of data){const sr=await fetch(SB_URL+'/storage/v1/object/sign/evidence-submissions/'+x.screenshot_path,{method:'POST',headers:h,body:JSON.stringify({expiresIn:600})});const sd=sr.ok?await sr.json():null;const image=sd?.signedURL?SB_URL+'/storage/v1'+sd.signedURL:null;
 const el=document.createElement('article');el.className='card';el.innerHTML='<div class="card-grid"><div>'+(image?'<img class="shot" src="'+esc(image)+'" alt="Submitted evidence">':'Screenshot unavailable')+'</div><div><h2>'+esc(x.item_name)+'</h2><div class="meta"><b>Type</b><span>'+esc(x.submission_type)+'</span><b>Category</b><span>'+esc(x.category)+'</span><b>Submitted</b><span>'+esc(new Date(x.created_at).toLocaleString())+'</span><b>Notes</b><span>'+esc(x.notes||'—')+'</span></div><div class="actions"><button class="btn approve">Approve</button><button class="btn danger reject">Reject</button></div></div></div>';const acts=el.querySelector('.actions');if(currentStatus==='pending'){el.querySelector('.approve').onclick=()=>decide(x.id,'approved',x.item_name);el.querySelector('.reject').onclick=()=>decide(x.id,'rejected',x.item_name)}else if(currentStatus==='rejected'){acts.innerHTML='<button class="btn restore">Restore to Pending</button>';acts.querySelector('.restore').onclick=()=>decide(x.id,'pending',x.item_name)}else acts.remove();const im=el.querySelector('.shot');if(im)im.onclick=()=>{$('lightbox-image').src=im.src;$('lightbox').classList.remove('hidden')};cards.appendChild(el)}
}
async function clearRejected(){if(!confirm('Permanently delete ALL rejected evidence submissions? This cannot be undone.'))return;if(!confirm('Final confirmation: delete every rejected submission and its review record?'))return;const r=await fetch(SB_URL+'/rest/v1/evidence_submissions?status=eq.rejected',{method:'DELETE',headers:{...headers,Authorization:'Bearer '+accessToken,Prefer:'return=minimal'}});if(r.ok)load();else alert('Could not clear rejected submissions.');}
async function decide(id,status,name){const verb=status==='approved'?'Approve':status==='rejected'?'Reject':'Restore to Pending';if(!confirm(verb+' evidence for "'+name+'"?'))return;const r=await fetch(SB_URL+'/rest/v1/evidence_submissions?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...headers,Authorization:'Bearer '+accessToken,Prefer:'return=minimal'},body:JSON.stringify({status,reviewed_at:new Date().toISOString()})});if(r.ok)load();else alert('Could not update submission.')}
$('clear-rejected').onclick=clearRejected;$('signin').onclick=signIn;$('forgot').onclick=resetPassword;$('logout').onclick=()=>location.reload();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentStatus=b.dataset.status;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});function openItems(){review.classList.add('hidden');$('items-panel').classList.remove('hidden');$('items-tab').classList.add('active');$('evidence-tab').classList.remove('active');$('items-frame').contentWindow.postMessage({type:'scavland-admin-token',token:accessToken},location.origin)}$('evidence-tab').onclick=()=>{review.classList.remove('hidden');$('items-panel').classList.add('hidden');$('evidence-tab').classList.add('active');$('items-tab').classList.remove('active')};$('items-tab').onclick=openItems;$('items-frame').onload=()=>{if(accessToken)$('items-frame').contentWindow.postMessage({type:'scavland-admin-token',token:accessToken},location.origin)};$('close-lightbox').onclick=()=>$('lightbox').classList.add('hidden');$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').classList.add('hidden')};
statusEl.textContent='Admin login ready.';
</script><script>
const vendorsTab=document.createElement('button');vendorsTab.id='vendors-tab';vendorsTab.className='btn';vendorsTab.type='button';vendorsTab.textContent='Vendors';$('admin-tabs').appendChild(vendorsTab);const vendorsPanel=document.createElement('section');vendorsPanel.id='vendors-panel';vendorsPanel.className='hidden';vendorsPanel.innerHTML='<iframe id="vendors-frame" class="item-frame" src="vendors-admin.html?embed=1" title="Vendor editor"></iframe>';$('items-panel').after(vendorsPanel);function openVendors(){review.classList.add('hidden');$('items-panel').classList.add('hidden');vendorsPanel.classList.remove('hidden');$('evidence-tab').classList.remove('active');$('items-tab').classList.remove('active');vendorsTab.classList.add('active');$('vendors-frame').contentWindow.postMessage({type:'scavland-admin-token',token:accessToken},location.origin)}vendorsTab.onclick=openVendors;$('vendors-frame').onload=()=>{if(accessToken)$('vendors-frame').contentWindow.postMessage({type:'scavland-admin-token',token:accessToken},location.origin)};const originalEvidence=$('evidence-tab').onclick;$('evidence-tab').onclick=()=>{originalEvidence();vendorsPanel.classList.add('hidden');vendorsTab.classList.remove('active')};const originalItems=$('items-tab').onclick;$('items-tab').onclick=()=>{originalItems();vendorsPanel.classList.add('hidden');vendorsTab.classList.remove('active')};
const settingsTab=document.createElement('button');settingsTab.className='btn';settingsTab.textContent='Page settings';$('admin-tabs').appendChild(settingsTab);const settingsPanel=document.createElement('section');settingsPanel.className='hidden';settingsPanel.innerHTML='<iframe id="settings-frame" class="item-frame" src="settings-admin.html?embed=1" title="Page settings"></iframe>';vendorsPanel.after(settingsPanel);settingsTab.onclick=()=>{review.classList.add('hidden');$('items-panel').classList.add('hidden');vendorsPanel.classList.add('hidden');settingsPanel.classList.remove('hidden');$('evidence-tab').classList.remove('active');$('items-tab').classList.remove('active');vendorsTab.classList.remove('active');settingsTab.classList.add('active');$('settings-frame').contentWindow.postMessage({type:'scavland-admin-token',token:accessToken},location.origin)};$('settings-frame').onload=()=>{if(accessToken)$('settings-frame').contentWindow.postMessage({type:'scavland-admin-token',token:accessToken},location.origin)};
</script><script>const settingsEvidence=$('evidence-tab').onclick,settingsItems=$('items-tab').onclick,settingsVendors=vendorsTab.onclick;$('evidence-tab').onclick=()=>{settingsEvidence();settingsPanel.classList.add('hidden');settingsTab.classList.remove('active')};$('items-tab').onclick=()=>{settingsItems();settingsPanel.classList.add('hidden');settingsTab.classList.remove('active')};vendorsTab.onclick=()=>{settingsVendors();settingsPanel.classList.add('hidden');settingsTab.classList.remove('active')};</script><script>const hubStyle=document.createElement('style');hubStyle.textContent='#admin-tabs{display:none!important}.admin-hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}.admin-choice{min-height:150px;text-align:left;padding:20px}.admin-choice strong{display:block;font-size:20px;margin-bottom:7px}.admin-choice span{color:var(--scav-muted)}.admin-dashboard.hidden{display:none!important}';document.head.appendChild(hubStyle);const dashboard=document.createElement('section');dashboard.id='admin-dashboard';dashboard.className='admin-dashboard panel hidden';dashboard.innerHTML='<h2>Admin Hub</h2><p>Choose what you want to update.</p><div class="admin-hub"><button class="btn admin-choice" data-open="evidence"><strong>Evidence review</strong><span>Review screenshots and approve or reject submissions.</span></button><button class="btn admin-choice" data-open="items"><strong>Items</strong><span>Change item information, images and notes.</span></button><button class="btn admin-choice" data-open="vendors"><strong>Vendors</strong><span>Change vendors, stock, prices and portraits.</span></button><button class="btn admin-choice" data-open="settings"><strong>Page settings</strong><span>Change backgrounds, headers, fonts and sizes.</span></button></div></section>';$('admin-tabs').after(dashboard);const homeButton=document.createElement('button');homeButton.id='admin-home';homeButton.className='btn hidden admin-home';homeButton.type='button';homeButton.textContent='Admin Hub';$('logout').before(homeButton);function showHub(){dashboard.classList.remove('hidden');review.classList.add('hidden');$('items-panel').classList.add('hidden');vendorsPanel.classList.add('hidden');settingsPanel.classList.add('hidden');homeButton.classList.remove('hidden')}const previousLoad=load;load=async()=>{await previousLoad();if(!login.classList.contains('hidden'))showHub()};homeButton.onclick=showHub;dashboard.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>{dashboard.classList.add('hidden');const target=button.dataset.open;if(target==='evidence')$('evidence-tab').click();else if(target==='items')$('items-tab').click();else if(target==='vendors')vendorsTab.click();else settingsTab.click()});</script><script src="site-shell.js"></script></body></html>
