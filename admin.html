<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence Review | SCAVLAND</title><link rel="stylesheet" href="site-theme.css">
<style>
.admin-main{width:min(1200px,calc(100% - 28px));margin:40px auto 70px}.admin-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.admin-head h1{color:var(--scav-gold-bright)}.panel,.card{background:var(--scav-panel);border:1px solid var(--scav-line);border-radius:6px;padding:16px}.login{max-width:520px;margin:30px auto}.login input{width:100%;box-sizing:border-box;padding:11px;margin:7px 0;background:#111412;color:#eee;border:1px solid #484b45;border-radius:4px}.btn{padding:9px 13px;border:1px solid var(--scav-gold-bright);background:#171713;color:var(--scav-gold-bright);border-radius:4px;cursor:pointer}.btn:hover{background:var(--scav-gold-bright);color:#171713}.danger{border-color:#a65f5f;color:#f0b4b4}.cards{display:grid;gap:14px;margin-top:18px}.card-grid{display:grid;grid-template-columns:minmax(240px,420px) 1fr;gap:18px}.shot{width:100%;max-height:360px;object-fit:contain;background:#090a09;border:1px solid #343632}.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 12px}.meta b{color:var(--scav-gold-bright)}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.status{color:var(--scav-muted)}.hidden{display:none}@media(max-width:720px){.card-grid{grid-template-columns:1fr}}
</style></head><body><main class="admin-main"><div class="admin-head"><h1>Evidence Review</h1><button id="logout" class="btn hidden">Sign out</button></div>
<section id="login" class="panel login"><h2>Admin sign in</h2><p>Authorized reviewers only.</p><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="btn">Sign in</button> <button id="forgot" class="btn" type="button">Reset password</button><p id="login-status" class="status"></p><div id="reset-box" class="hidden"><h3>Set a new password</h3><input id="new-password" type="password" autocomplete="new-password" minlength="10" placeholder="New password"><button id="save-password" class="btn" type="button">Save new password</button><p id="reset-status" class="status"></p></div></section>
<section id="review" class="hidden"><div class="panel"><strong>Pending evidence</strong> <span id="count" class="status"></span></div><div id="cards" class="cards"></div></section></main>
<script>
const URL='https://demtoqsafufzmnhvaykj.supabase.co',KEY='sb_publishable_0kdLCpTy7Sf8BKkIU5TOqw_Qaay4gzH';
const $=id=>document.getElementById(id), statusEl=$('login-status'), login=$('login'),review=$('review'),cards=$('cards');
const headers={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
let accessToken=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,opt={}){return fetch(URL+path,{...opt,headers:{...headers,...(opt.headers||{})}})}
async function signIn(){
 statusEl.textContent='Signing in…';
 const r=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});
 const d=await r.json(); if(!r.ok){statusEl.textContent=(d.error_description||d.msg||d.message||'Sign-in failed.');return}
 accessToken=d.access_token;statusEl.textContent='Signed in. Loading admin review…';await load();
}
async function resetPassword(){
 const email=$('email').value.trim();if(!email){statusEl.textContent='Enter your admin email first.';return}
 statusEl.textContent='Sending password reset email…';
 const r=await api('/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:JSON.stringify({email})});
 if(r.ok)statusEl.textContent='Password reset email sent. Open the newest email.';else{const d=await r.json();statusEl.textContent=d.msg||d.message||'Could not send reset email.'}
}
async function load(){
 const h={...headers,Authorization:'Bearer '+accessToken};
 const r=await fetch(URL+'/rest/v1/evidence_submissions?status=eq.pending&order=created_at.desc',{headers:h});
 if(!r.ok){statusEl.textContent='Signed in, but this account is not authorized as a SCAVLAND admin.';return}
 const data=await r.json();login.classList.add('hidden');review.classList.remove('hidden');$('logout').classList.remove('hidden');$('count').textContent='('+data.length+')';cards.innerHTML='';
 for(const x of data){const sr=await fetch(URL+'/storage/v1/object/sign/evidence-submissions/'+x.screenshot_path,{method:'POST',headers:h,body:JSON.stringify({expiresIn:600})});const sd=sr.ok?await sr.json():null;const image=sd?.signedURL?URL+'/storage/v1'+sd.signedURL:null;
 const el=document.createElement('article');el.className='card';el.innerHTML='<div class="card-grid"><div>'+(image?'<img class="shot" src="'+esc(image)+'" alt="Submitted evidence">':'Screenshot unavailable')+'</div><div><h2>'+esc(x.item_name)+'</h2><div class="meta"><b>Type</b><span>'+esc(x.submission_type)+'</span><b>Category</b><span>'+esc(x.category)+'</span><b>Submitted</b><span>'+esc(new Date(x.created_at).toLocaleString())+'</span><b>Notes</b><span>'+esc(x.notes||'—')+'</span></div><div class="actions"><button class="btn approve">Approve</button><button class="btn danger reject">Reject</button></div></div></div>';el.querySelector('.approve').onclick=()=>decide(x.id,'approved');el.querySelector('.reject').onclick=()=>decide(x.id,'rejected');cards.appendChild(el)}
}
async function decide(id,status){const r=await fetch(URL+'/rest/v1/evidence_submissions?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...headers,Authorization:'Bearer '+accessToken,Prefer:'return=minimal'},body:JSON.stringify({status,reviewed_at:new Date().toISOString()})});if(r.ok)load();else alert('Could not update submission.')}
$('signin').onclick=signIn;$('forgot').onclick=resetPassword;$('logout').onclick=()=>location.reload();
statusEl.textContent='Admin login ready.';
</script><script src="site-shell.js"></script></body></html>
