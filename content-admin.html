<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Editor | SCAVLAND</title><link rel="stylesheet" href="site-theme.css"><style>
body.embed .scav-site-header,body.embed .scav-site-nav{display:none!important}.main{width:min(1300px,calc(100% - 28px));margin:24px auto}.layout{display:grid;grid-template-columns:240px 1fr;gap:16px}.panel{background:var(--scav-panel);border:1px solid var(--scav-line);border-radius:6px;padding:16px}.list button{display:block;width:100%;padding:10px;text-align:left;background:transparent;color:#eee;border:0;border-bottom:1px solid var(--scav-line);cursor:pointer}.list button.active,.list button:hover{background:#302915;color:var(--scav-gold-bright)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:grid;gap:5px;font-weight:700}input,textarea{box-sizing:border-box;width:100%;padding:10px;background:#111412;color:#eee;border:1px solid #484b45;border-radius:4px}.btn{padding:9px 13px;border:1px solid var(--scav-gold-bright);background:#171713;color:var(--scav-gold-bright);border-radius:4px;cursor:pointer}.btn:disabled{opacity:.45}.status{color:var(--scav-muted);white-space:pre-wrap}.preview{padding:20px;background:var(--preview-panel,#141615);color:var(--preview-text,#e8e5dc);border:1px solid var(--scav-line);border-radius:6px;min-height:220px}.preview h2{color:var(--preview-accent,#ffcc66)}.card-preview{padding:12px;border:1px solid var(--scav-line);margin-top:10px}.hidden{display:none}@media(max-width:760px){.layout,.grid{grid-template-columns:1fr}}
</style></head><body><main class="main"><section class="layout"><aside class="panel"><strong>Public pages</strong><div id="list" class="list"></div></aside><section class="panel"><h1 id="title">Home content</h1><p id="status" class="status">Choose a page to edit.</p><div id="editor" class="grid hidden"><label class="wide">Page title<input id="page-title" maxlength="200"></label><label class="wide">Intro text<input id="page-intro" maxlength="200"></label><div id="cards" class="wide"></div><div class="preview wide" id="preview"><h2></h2><p></p><div id="preview-cards"></div></div><div class="wide"><button id="validate" class="btn" type="button">Validate changes</button> <button id="publish" class="btn" type="button" disabled>Publish to GitHub</button><p id="message" class="status"></p></div></div></section></section></main><script>
const SB='https://demtoqsafufzmnhvaykj.supabase.co',KEY='sb_publishable_0kdLCpTy7Sf8BKkIU5TOqw_Qaay4gzH',URL=SB+'/functions/v1/publish-site-content',$=id=>document.getElementById(id);let token='',documentData,selectedPage=null,original=null,changes=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function enter(candidate){const r=await fetch(SB+'/rest/v1/rpc/is_scavland_admin',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+candidate,'Content-Type':'application/json'},body:'{}'});if(!r.ok||await r.json()!==true)return false;token=candidate;documentData=await fetch('data/site-content.json',{cache:'no-store'}).then(r=>r.json());renderPages();return true}
function renderPages(){$('list').innerHTML='<button data-page="index.html">Home</button>';document.querySelectorAll('#list button').forEach(b=>b.onclick=()=>select(b.dataset.page))}
function select(page){selectedPage=page;original=structuredClone(documentData.pages[page]);$('title').textContent='Home content';$('editor').classList.remove('hidden');$('page-title').value=original.title||'';$('page-intro').value=original.intro||'';renderCards();renderPreview();document.querySelectorAll('#list button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function renderCards(){const cards=(original.sections||[]).flatMap(s=>s.cards||[]);$('cards').innerHTML=cards.map((card,i)=>'<div class="card-preview"><label>Card '+(i+1)+' title<input data-card="'+i+'" data-key="title" value="'+esc(card.title||'')+'"></label><label>Description<textarea data-card="'+i+'" data-key="description" rows="3">'+esc(card.description||'')+'</textarea></label></div>').join('');document.querySelectorAll('[data-card]').forEach(input=>input.oninput=()=>{original.sections.flatMap(s=>s.cards||[])[Number(input.dataset.card)][input.dataset.key]=input.value;renderPreview()})}
function renderPreview(){const p=original;$('preview').querySelector('h2').textContent=p.title||'';$('preview').querySelector('p').textContent=p.intro||'';$('preview-cards').innerHTML=(p.sections||[]).flatMap(s=>s.cards||[]).map(c=>'<div><strong>'+esc(c.title)+'</strong><p>'+esc(c.description)+'</p></div>').join('')}
function validate(){changes=structuredClone(original);if(!changes.title.trim()){$('message').textContent='Page title is required.';$('publish').disabled=true;return}$('message').textContent='Ready to publish Home content.';$('publish').disabled=false}
async function publish(){if(!changes)return;$('publish').disabled=true;const r=await fetch(URL,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({page:selectedPage,content:changes})}),d=await r.json().catch(()=>({}));$('message').textContent=r.ok?'Published. GitHub Pages will update shortly. '+(d.commitUrl||''):(d.error||'Publish failed.');if(!r.ok)$('publish').disabled=false}
$('validate').onclick=validate;$('publish').onclick=publish;window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.data?.type!=='scavland-admin-token')return;if(!await enter(e.data.token))$('status').textContent='The parent admin session is not authorized.'});if(window.parent!==window)window.parent.postMessage({type:'scavland-admin-ready'},location.origin);
</script></body></html>
