name: Apply evidence rename map
on:
  push:
    paths:
      - evidence-rename-map.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply reviewed evidence moves
        run: python scripts/rename-evidence.py
      - name: Commit archive migration
        run: |
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence-inbox
          git commit -m "Apply reviewed evidence archive renames"
          git pull --rebase origin main
          git push
