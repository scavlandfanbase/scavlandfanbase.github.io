name: Build evidence analysis index
on:
  push:
    branches: [main]
    paths:
      - 'evidence-inbox/**'
      - '.github/workflows/build-evidence-index.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --quiet pillow ImageHash pytesseract
      - name: Build evidence index
        run: |
          python - <<'PY'
          import os,re,json,hashlib
          from PIL import Image
          import imagehash,pytesseract
          root='evidence-inbox'
          out=[]
          rx=re.compile(r'(20\d\d)[-_ ](\d\d)[-_ ](\d\d)[ _-]?(\d\d)(\d\d)(\d\d)?')
          paths=[]
          for base,_,names in os.walk(root):
              for fn in names:
                  if fn.lower().endswith(('.png','.jpg','.jpeg','.webp')):
                      paths.append(os.path.join(base,fn))
          for p in sorted(paths):
              fn=os.path.relpath(p,root).replace(os.sep,'/')
              b=open(p,'rb').read()
              rec={'file':fn,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
              m=rx.search(fn)
              if m:
                  y,mo,d,h,mi,s=m.groups(); rec['filename_timestamp']=f'{y}-{mo}-{d}T{h}:{mi}:{s or "00"}'
              try:
                  im=Image.open(p).convert('RGB')
                  rec['width'],rec['height']=im.size
                  rec['phash']=str(imagehash.phash(im))
                  # OCR is only an identification aid; never canonical evidence by itself.
                  txt=pytesseract.image_to_string(im,config='--psm 6')
                  rec['ocr']=' '.join(txt.split())[:2500]
              except Exception as e:
                  rec['error']=str(e)
              out.append(rec)
          groups={}
          for r in out: groups.setdefault(r['sha256'],[]).append(r['file'])
          exact=[v for v in groups.values() if len(v)>1]
          json.dump({'generated_from':'evidence-inbox','count':len(out),'exact_duplicate_groups':exact,'files':out},open('evidence-analysis.json','w'),indent=2,ensure_ascii=False)
          print('Indexed',len(out),'images; exact duplicate groups:',len(exact))
          PY
      - name: Commit analysis index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence-analysis.json
          git diff --cached --quiet && exit 0
          git commit -m "Build evidence screenshot analysis index"
          git pull --rebase origin main
          git push
