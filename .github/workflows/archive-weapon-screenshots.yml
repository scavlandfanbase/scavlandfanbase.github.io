name: Archive superseded Scavland evidence

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'screenshots/**'

permissions:
  contents: write

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[evidence-archive]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Archive replaced evidence
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          changed=0

          while IFS= read -r -d '' file; do
            [[ "$file" == evidence-archive/* ]] && continue
            if git cat-file -e "HEAD^:$file" 2>/dev/null; then
              dir="evidence-archive/${file%/*}"
              base="${file##*/}"
              stem="${base%.*}"
              ext="${base##*.}"
              mkdir -p "$dir"
              if [[ "$base" == "$ext" ]]; then
                target="$dir/${base}__${stamp}"
              else
                target="$dir/${stem}__${stamp}.${ext}"
              fi
              git show "HEAD^:$file" > "$target"
              changed=1
            fi
          done < <(git diff --name-only -z --diff-filter=M HEAD^ HEAD -- images screenshots 2>/dev/null || true)

          if [[ "$changed" -eq 0 ]]; then
            echo "No superseded evidence to archive."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence-archive
          git commit -m "[evidence-archive] Preserve superseded Scavland evidence"
          git push
