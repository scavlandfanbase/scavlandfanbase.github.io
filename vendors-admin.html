<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendors Admin | SCAVLAND</title><link rel="stylesheet" href="site-theme.css"><style>
body.embed .scav-site-header,body.embed .scav-site-nav{display:none!important}.main{width:min(1300px,calc(100% - 28px));margin:24px auto}.panel{background:var(--scav-panel);border:1px solid var(--scav-line);border-radius:6px;padding:16px}.layout{display:grid;grid-template-columns:280px 1fr;gap:16px}.list{max-height:700px;overflow:auto}.choice{display:block;width:100%;text-align:left;padding:9px;background:transparent;color:#eee;border:0;border-bottom:1px solid #343632;cursor:pointer}.choice.active,.choice:hover{background:#302915;color:var(--scav-gold-bright)}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;background:#111412;color:#eee;border:1px solid #484b45;border-radius:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.field{display:grid;gap:5px}.btn{padding:9px 13px;border:1px solid var(--scav-gold-bright);background:#171713;color:var(--scav-gold-bright);border-radius:4px;cursor:pointer}.btn:disabled{opacity:.45}.status{color:var(--scav-muted);white-space:pre-wrap}.portrait{max-width:260px;max-height:260px;object-fit:contain;background:#090a09;border:1px solid #343632}.hidden{display:none}@media(max-width:760px){.layout,.grid{grid-template-columns:1fr}}
</style></head><body><main class="main"><section id="hub" class="layout"><aside class="panel"><label><strong>Find a vendor</strong><input id="search" type="search" placeholder="Search vendors"></label><p id="count" class="status"></p><div id="list" class="list"></div></aside><section class="panel"><h1 id="title">Select a vendor</h1><p id="status" class="status">Choose a vendor to edit their public record.</p><div id="editor" class="grid hidden"><label class="field"><b>Name</b><input id="name"></label><label class="field"><b>Location</b><input id="location"></label><label class="field"><b>Faction</b><input id="faction"></label><label class="field"><b>Inventory documented</b><select id="documented"><option value="true">Yes</option><option value="false">No</option></select></label><label class="field wide"><b>Portrait image path</b><input id="portrait" placeholder="evidence-inbox/vendors/example.png"><span>Use an existing image already stored in the repository.</span></label><div class="wide"><img id="preview" class="portrait hidden" alt="Vendor portrait preview"></div><label class="field wide"><b>Stock list</b><textarea id="inventory" rows="16"></textarea><span>One item per line: item ID | name | rank | price | details</span></label><div class="wide"><button id="validate" class="btn" type="button">Validate changes</button> <button id="publish" class="btn" type="button" disabled>Publish to GitHub</button><p id="message" class="status"></p></div></div></section></section></main><script>
const SB='https://demtoqsafufzmnhvaykj.supabase.co',KEY='sb_publishable_0kdLCpTy7Sf8BKkIU5TOqw_Qaay4gzH',URL=SB+'/functions/v1/publish-vendor';const $=x=>document.getElementById(x);let token='',vendors=[],selected=null,original=null,changes=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,opt={}){return fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+(opt.auth||KEY),'Content-Type':'application/json',...(opt.headers||{})}})}
async function enter(candidate){const r=await api('/rest/v1/rpc/is_scavland_admin',{method:'POST',auth:candidate,body:'{}'});if(!r.ok||await r.json()!==true)return false;token=candidate;const d=await fetch('data/vendors.json',{cache:'no-store'}).then(r=>r.json());vendors=(d.data||d).sort((a,b)=>a.name.localeCompare(b.name));render();return true}
function render(){const q=$('search').value.toLowerCase();const rows=vendors.filter(v=>v.name.toLowerCase().includes(q));$('count').textContent=rows.length+' vendors';$('list').innerHTML=rows.map(v=>'<button class="choice '+(selected?.id===v.id?'active':'')+'" data-id="'+esc(v.id)+'">'+esc(v.name)+'<br><small>'+esc(v.factionId||'No faction')+'</small></button>').join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(b.dataset.id))}
function stock(v){return (v.inventory||[]).map(x=>[x.itemId,x.name,x.rank,x.price,x.details].join(' | ')).join('\n')}function parseStock(s){return s.split('\n').filter(Boolean).map((line,i)=>{const p=line.split('|').map(x=>x.trim());if(p.length!==5||!p[0]||!p[1]||!p[2]||!/^\d+$/.test(p[3]))throw new Error('Stock line '+(i+1)+' must have item ID, name, rank, whole-number price and details.');return {itemId:p[0],name:p[1],rank:p[2],price:Number(p[3]),details:p[4]}})}
function pick(id){selected=vendors.find(v=>v.id===id);original=structuredClone(selected);$('title').textContent='Editing '+selected.name;$('status').textContent='Changes are reviewed before publishing.';$('editor').classList.remove('hidden');$('name').value=selected.name;$('location').value=selected.location||'';$('faction').value=selected.factionId||'';$('documented').value=String(!!selected.inventoryDocumented);$('portrait').value=selected.portrait?.file||'';$('inventory').value=stock(selected);$('message').textContent='';$('publish').disabled=true;preview();render()}
function preview(){const path=$('portrait').value.trim(),image=$('preview');if(path){image.src=path;image.classList.remove('hidden')}else image.classList.add('hidden')}
function collect(){const portrait=$('portrait').value.trim();return {name:$('name').value.trim(),location:$('location').value.trim(),factionId:$('faction').value.trim(),inventoryDocumented:$('documented').value==='true',inventory:parseStock($('inventory').value),...(portrait?{portrait:{...(original.portrait||{}),file:portrait}}:{portrait:null})}}
function validate(){try{const next=collect();if(!next.name||!next.factionId)throw new Error('Name and faction are required.');if(next.portrait&&!/^(images|evidence-inbox)\/.+\.(png|jpe?g|webp)$/i.test(next.portrait.file))throw new Error('Portrait must be an existing repository image in images/ or evidence-inbox/.');changes=Object.fromEntries(Object.entries(next).filter(([k,v])=>JSON.stringify(v)!==JSON.stringify(original[k])));if(!Object.keys(changes).length)throw new Error('There are no changes to publish.');$('message').textContent='Ready: '+Object.keys(changes).join(', ');$('publish').disabled=false}catch(e){changes=null;$('publish').disabled=true;$('message').textContent=e.message}}
async function publish(){if(!changes)return;$('publish').disabled=true;$('message').textContent='Publishing to GitHub…';const r=await fetch(URL,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({vendorId:selected.id,changes})});const d=await r.json();if(!r.ok){$('message').textContent=d.error||'Publish failed.';$('publish').disabled=false;return}$('message').innerHTML='Published. GitHub Pages will update shortly. '+(d.commitUrl?'<a href="'+d.commitUrl+'" target="_blank">View commit</a>':'')}
$('search').oninput=render;$('portrait').oninput=preview;$('validate').onclick=validate;$('publish').onclick=publish;window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.data?.type!=='scavland-admin-token')return;if(!await enter(e.data.token))$('status').textContent='The parent admin session is not authorized.'});if(!new URLSearchParams(location.search).has('embed'))$('status').textContent='Open this screen from the main admin hub.';
</script><script>if(window.parent!==window)window.parent.postMessage({type:'scavland-admin-ready'},location.origin);</script></body></html>
