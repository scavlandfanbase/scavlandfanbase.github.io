<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Items Database | SCAVLAND</title><link rel="stylesheet" href="site-theme.css">
<style>
.items-main{width:min(1600px,calc(100% - 40px));margin:42px auto 70px}.items-head{text-align:center;margin-bottom:28px}.items-head h1{margin:0 0 8px;color:var(--scav-gold-bright);font-size:clamp(32px,4vw,52px)}.items-head p{color:var(--scav-muted);margin:0}
.item-tools{display:flex;gap:12px;flex-wrap:wrap;background:var(--scav-panel);border:1px solid var(--scav-line);padding:18px;border-radius:6px;margin-bottom:14px}.item-tools input{flex:1 1 320px;padding:13px 15px;border:1px solid #484b45;border-radius:4px}.item-filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.item-filter{background:#171a18;color:#ddd;border:1px solid #484b45;padding:9px 13px;border-radius:4px;cursor:pointer}.item-filter.active,.item-filter:hover{background:var(--scav-gold-bright);color:#171713;border-color:var(--scav-gold-bright)}.item-count{color:var(--scav-muted);margin:0 0 15px}.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.item-card{background:var(--scav-panel);border:1px solid var(--scav-line);border-radius:6px;padding:18px;min-height:128px;display:flex;flex-direction:column;gap:12px}.item-card h2{font-size:18px;margin:0;color:var(--scav-gold-bright);line-height:1.25}.item-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.item-tag{font-size:12px;padding:4px 7px;border:1px solid #55574f;border-radius:3px;color:#c8c5bc;background:#111412}.empty{grid-column:1/-1;padding:35px;text-align:center;color:var(--scav-muted)}
@media(max-width:600px){.items-main{width:calc(100% - 24px);margin-top:28px}.item-grid{grid-template-columns:1fr}}
</style></head><body>
<main class="items-main"><section class="items-head"><h1>Items Database</h1><p>Search the SCAVLAND item registry. Information is expanded as in-game evidence is verified.</p></section>
<div class="item-tools"><input id="item-search" type="search" placeholder="Search items..." autocomplete="off"></div>
<div class="item-filters" id="item-filters"></div><div class="item-count" id="item-count">Loading items…</div><section class="item-grid" id="item-grid"></section></main>
<script>
const labels={weapon:'Weapons',armour:'Armour',ammunition:'Ammo','crafted-item':'Crafted','crafting-resource':'Crafting','vendor-item':'Vendor Items'};
let items=[],active='all';
const clean=n=>n.replace(/^[^A-Za-z0-9]+\s*/,'').replace(/##/g,' / ').trim();
function renderFilters(){const order=['all','weapon','armour','ammunition','crafted-item','crafting-resource','vendor-item'];document.getElementById('item-filters').innerHTML=order.map(k=>'<button class="item-filter '+(active===k?'active':'')+'" data-filter="'+k+'">'+(k==='all'?'All Items':labels[k])+'</button>').join('');document.querySelectorAll('.item-filter').forEach(b=>b.onclick=()=>{active=b.dataset.filter;renderFilters();render()})}
function render(){const q=document.getElementById('item-search').value.trim().toLowerCase();const list=items.filter(x=>(active==='all'||(x.classification||[]).includes(active))&&clean(x.name).toLowerCase().includes(q));document.getElementById('item-count').textContent=list.length+' of '+items.length+' items';document.getElementById('item-grid').innerHTML=list.length?list.map(x=>'<article class="item-card"><h2>'+clean(x.name)+'</h2><div class="item-tags">'+(x.classification||[]).map(c=>'<span class="item-tag">'+(labels[c]||c.replaceAll('-',' '))+'</span>').join('')+'</div></article>').join(''):'<div class="empty">No items match this search.</div>'}
fetch('data/items.json').then(r=>r.json()).then(j=>{items=j.data||[];items.sort((a,b)=>clean(a.name).localeCompare(clean(b.name)));renderFilters();render()}).catch(()=>{document.getElementById('item-count').textContent='Unable to load item data.'});
document.getElementById('item-search').addEventListener('input',render);
</script><script src="site-shell.js"></script></body></html>
