<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Items Database | SCAVLAND</title><link rel="stylesheet" href="site-theme.css">
<style>
.items-main{width:min(1600px,calc(100% - 40px));margin:42px auto 70px}.items-head{text-align:center;margin-bottom:28px}.items-head h1{margin:0 0 8px;color:var(--scav-gold-bright);font-size:clamp(32px,4vw,52px)}.items-head p{color:var(--scav-muted);margin:0}
.item-tools{display:flex;gap:12px;flex-wrap:wrap;background:var(--scav-panel);border:1px solid var(--scav-line);padding:18px;border-radius:6px;margin-bottom:14px}.item-tools input{flex:1 1 320px;padding:13px 15px;border:1px solid #484b45;border-radius:4px}.item-filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.item-filter{background:#171a18;color:#ddd;border:1px solid #484b45;padding:9px 13px;border-radius:4px;cursor:pointer}.item-filter.active,.item-filter:hover{background:var(--scav-gold-bright);color:#171713;border-color:var(--scav-gold-bright)}.item-count{color:var(--scav-muted);margin:0 0 15px}.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.item-card{background:var(--scav-panel);border:1px solid var(--scav-line);border-radius:6px;padding:18px;min-height:128px;display:flex;flex-direction:column;gap:12px}.item-card h2{font-size:18px;margin:0;color:var(--scav-gold-bright);line-height:1.25}.item-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px;color:#ddd}.item-stat{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #343632;padding:4px 0}.item-stat b{color:var(--scav-gold-bright);font-weight:700}.item-note{font-size:12px;color:var(--scav-muted);line-height:1.35}.item-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.item-tag{font-size:12px;padding:4px 7px;border:1px solid #55574f;border-radius:3px;color:#c8c5bc;background:#111412}.verify-badge{font-size:11px;padding:4px 7px;border-radius:3px;border:1px solid #55574f}.verify-badge.verified{color:#bde8bd;border-color:#4f7d4f;background:#142014}.verify-badge.review{color:#e5c98c;border-color:#76633d;background:#211c12}.empty{grid-column:1/-1;padding:35px;text-align:center;color:var(--scav-muted)}
@media(max-width:600px){.items-main{width:calc(100% - 24px);margin-top:28px}.item-grid{grid-template-columns:1fr}}
</style></head><body>
<main class="items-main"><section class="items-head"><h1>Items Database</h1><p>Search the SCAVLAND item registry. Information is expanded as in-game evidence is verified.</p></section>
<div class="item-tools"><input id="item-search" type="search" placeholder="Search items..." autocomplete="off"></div>
<div class="item-filters" id="item-filters"></div><div class="item-count" id="item-count">Loading items…</div><section class="item-grid" id="item-grid"></section></main>
<script>
const labels={weapon:'Weapons',armour:'Armour',ammunition:'Ammo','crafted-item':'Crafted','crafting-resource':'Crafting','vendor-item':'Vendor Items'};
let items=[],active='all',weapons=[],armour=[],ammo=[],crafting=[],vendors=[];
const norm=s=>clean(String(s||'')).toLowerCase();
function sourceStatus(x){\n const n=norm(x.name),records=[weapons.find(v=>norm(v.name)===n),armour.find(v=>norm(v.name)===n),ammo.find(v=>norm(v.name)===n),crafting.find(v=>norm(v.name)===n)].filter(Boolean);\n const statuses=records.map(v=>v.source?.status).filter(Boolean);\n return statuses.length&&statuses.every(v=>v==='screenshot-verified')?{label:'✓ In-game verified',cls:'verified'}:{label:'Needs verification',cls:'review'};\n}\nfunction itemStats(x){
 const n=norm(x.name), bits=[];
 const w=weapons.find(v=>norm(v.name)===n); if(w){bits.push(['Tier',w.tier],['Damage',w.damage],['RPM',w.rpm],['Range',w.range],['Accuracy',w.accuracy],['Recoil',w.recoil],['Handling',w.handling],['Ergonomics',w.ergonomics],['Reload',w.reload],['Ammo',w.ammo]);}
 const a=armour.find(v=>norm(v.name)===n); if(a){bits.push(['Category',a.category],['Rank',a.vendorRank],['Price',a.price],['Ballistic',a.ballistic],['Slash',a.slash],['Radiation',a.radiation],['Repair',a.repairClass]);}
 const m=ammo.find(v=>norm(v.name)===n); if(m){bits.push(['Est. Price',m.estimatedPrice],['Damage',m.damage],['Penetration',m.penetrationPercent==null?null:m.penetrationPercent+'%'],['Max Stack',m.maxStack]);}
 const c=crafting.find(v=>norm(v.name)===n); if(c){bits.push(['Workbench',c.workbench]); if(c.ingredients?.length) bits.push(['Recipe',c.ingredients.map(i=>i.quantity+'× '+i.name).join(', ')]);}
 const inv=[]; vendors.forEach(v=>(v.inventory||[]).forEach(i=>{if(norm(i.name)===n)inv.push({vendor:v.name,rank:i.rank,price:i.price,details:i.details})})); if(inv.length){const best=inv[0];bits.push(['Vendor',best.vendor],['Rank',best.rank],['Price',best.price]); if(inv.length>1)bits.push(['Listings',inv.length]);}
 return bits.filter(([,v])=>v!==null&&v!==undefined&&v!=='');
}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
const clean=n=>n.replace(/^[^A-Za-z0-9]+\s*/,'').replace(/##/g,' / ').trim();
function renderFilters(){const order=['all','weapon','armour','ammunition','crafted-item','crafting-resource','vendor-item'];document.getElementById('item-filters').innerHTML=order.map(k=>'<button class="item-filter '+(active===k?'active':'')+'" data-filter="'+k+'">'+(k==='all'?'All Items':labels[k])+'</button>').join('');document.querySelectorAll('.item-filter').forEach(b=>b.onclick=()=>{active=b.dataset.filter;renderFilters();render()})}
function render(){const q=document.getElementById('item-search').value.trim().toLowerCase();const list=items.filter(x=>(active==='all'||(x.classification||[]).includes(active))&&clean(x.name).toLowerCase().includes(q));document.getElementById('item-count').textContent=list.length+' of '+items.length+' items';document.getElementById('item-grid').innerHTML=list.length?list.map(x=>{const stats=itemStats(x);const verify=sourceStatus(x);return '<article class="item-card"><h2>'+esc(clean(x.name))+'</h2>'+(stats.length?'<div class="item-stats">'+stats.map(([k,v])=>'<div class="item-stat"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>').join('')+'</div>':'<div class="item-note">No verified stats recorded yet.</div>')+'<div class="item-tags"><span class="verify-badge '+verify.cls+'">'+verify.label+'</span>'+(x.classification||[]).map(c=>'<span class="item-tag">'+esc(labels[c]||c.replaceAll('-',' '))+'</span>').join('')+'</div></article>'}).join(''):'<div class="empty">No items match this search.</div>'}
Promise.all(['items','weapons','armour','ammo','crafting','vendors'].map(n=>fetch('data/'+n+'.json').then(r=>r.json()))).then(([i,w,a,m,c,v])=>{items=i.data||[];weapons=w.data||[];armour=a.data||[];ammo=m.data||[];crafting=c.data||[];vendors=v.data||[];items.sort((a,b)=>clean(a.name).localeCompare(clean(b.name)));renderFilters();render()}).catch(()=>{document.getElementById('item-count').textContent='Unable to load item data.'});
document.getElementById('item-search').addEventListener('input',render);
</script><script src="site-shell.js"></script></body></html>
