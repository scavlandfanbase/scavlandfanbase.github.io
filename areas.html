<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SCAVLAND Areas</title>

<style>
/* --- NAV BAR --- */
.nav-bar {
    background: #222;
    padding: 15px 20px;
    border-bottom: 2px solid #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #ffcc66;
    margin-bottom: 8px;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: #ffffff;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

.nav-links a:hover {
    color: #ffcc66;
}

/* --- PAGE STYLE --- */
body {
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    padding: 20px;
    text-align: center;
}

h1 {
    color: #ffcc66;
    margin-top: 40px;
}

.construction-box {
    margin-top: 40px;
    padding: 30px;
    background: #222;
    border: 2px solid #ffcc66;
    border-radius: 8px;
    display: inline-block;
}

.construction-box p {
    font-size: 20px;
    color: #ccc;
}
</style>

<link rel="stylesheet" href="site-theme.css">
</head>
<body>

<!-- PAGE TITLE -->
<h1>Areas</h1>

<!-- UNDER CONSTRUCTION BOX -->
<div class="construction-box">
    <p>This page is currently under construction.</p>
    <p>More SCAVLAND locations will be added soon.</p>
</div>

<script src="site-shell.js"></script>
</body>
</html>
