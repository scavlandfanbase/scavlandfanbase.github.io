<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SCAVLAND Map</title>
<link rel="stylesheet" href="site-theme.css">
<style>
.map-page{width:100%;margin:0 auto;padding:0 0 30px}
.map-intro{text-align:center;padding:24px 20px 18px;background:rgba(18,20,19,.94);border-bottom:1px solid var(--scav-line)}
.map-intro h1{margin:0 0 6px;color:var(--scav-gold-bright);font-size:clamp(30px,3vw,48px)}
.map-intro p{margin:0;color:#bbb;font-size:clamp(14px,1.2vw,18px)}
.map-toolbar{position:sticky;top:58px;z-index:20;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;background:rgba(10,12,11,.96);border-bottom:1px solid var(--scav-line)}
.map-toolbar button{background:#242624;color:#eee;border:1px solid #555;border-radius:5px;padding:9px 14px;font-weight:700;cursor:pointer}
.map-toolbar button:hover{background:var(--scav-gold-bright);color:#111;border-color:var(--scav-gold-bright)}
#zoomLabel{min-width:64px;text-align:center;color:var(--scav-gold-bright);font-weight:700}
.map-help{color:#999;font-size:13px;margin-left:8px}
.map-viewport{position:relative;width:calc(100% - clamp(16px,2vw,36px));height:clamp(600px,78vh,1200px);margin:14px auto 30px;overflow:hidden;background:#090a09;border:1px solid var(--scav-line);box-shadow:0 12px 35px rgba(0,0,0,.45);cursor:grab;touch-action:none}
.map-viewport.dragging{cursor:grabbing;user-select:none}
.map-stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.map-img{display:block;width:auto!important;height:auto!important;max-width:none!important;max-height:none!important;border:0!important;box-shadow:none!important;user-select:none;-webkit-user-drag:none}
@media(max-width:700px){.map-intro{padding:18px 12px 14px}.map-toolbar{top:50px}.map-help{width:100%;text-align:center;margin:2px 0 0}.map-viewport{width:calc(100% - 8px);height:72vh;margin-top:6px}}.map-help{width:100%;text-align:center;margin:2px 0 0}.map-viewport{width:calc(100% - 12px);height:68vh;margin-top:6px}}
</style>
</head>
<body>
<main class="map-page">
<section class="map-intro"><h1>SCAVLAND Map</h1><p>Zoom and pan around Zalesye to inspect locations, vendors, factions and points of interest.</p></section>
<div class="map-toolbar" aria-label="Map controls">
<button id="zoomOut" type="button" aria-label="Zoom out">− Zoom</button>
<span id="zoomLabel">100%</span>
<button id="zoomIn" type="button" aria-label="Zoom in">+ Zoom</button>
<button id="fitMap" type="button">Fit Screen</button>
<button id="actualMap" type="button">100%</button>
<span class="map-help">Mouse wheel to zoom · drag to move · scrollbars also work</span>
</div>
<div class="map-viewport" id="mapViewport">
<div class="map-stage" id="mapStage"><img src="images/scavland-map.png" alt="SCAVLAND map of Zalesye" class="map-img" id="mapImage" draggable="false"></div>
</div>
</main>
<script>
(function(){
 const viewport=document.getElementById('mapViewport'),stage=document.getElementById('mapStage'),img=document.getElementById('mapImage'),label=document.getElementById('zoomLabel');
 let scale=1,minScale=.05,maxScale=5,x=0,y=0,drag=false,startX=0,startY=0,startPanX=0,startPanY=0;

 function apply(){
   stage.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')';
   label.textContent=Math.round(scale*100)+'%';
 }
 function clampPan(){
   if(!img.naturalWidth)return;
   const w=img.naturalWidth*scale,h=img.naturalHeight*scale,vw=viewport.clientWidth,vh=viewport.clientHeight;
   const pad=40;
   if(w<=vw){x=(vw-w)/2}else{x=Math.min(pad,Math.max(vw-w-pad,x))}
   if(h<=vh){y=(vh-h)/2}else{y=Math.min(pad,Math.max(vh-h-pad,y))}
 }
 function fit(){
   if(!img.naturalWidth)return;
   scale=Math.min(viewport.clientWidth/img.naturalWidth,viewport.clientHeight/img.naturalHeight);
   scale=Math.max(minScale,Math.min(maxScale,scale));
   x=(viewport.clientWidth-img.naturalWidth*scale)/2;
   y=(viewport.clientHeight-img.naturalHeight*scale)/2;
   apply();
 }
 function setScale(next,cx,cy){
   if(!img.naturalWidth)return;
   next=Math.max(minScale,Math.min(maxScale,next));
   cx=cx==null?viewport.clientWidth/2:cx; cy=cy==null?viewport.clientHeight/2:cy;
   const imageX=(cx-x)/scale,imageY=(cy-y)/scale;
   scale=next;x=cx-imageX*scale;y=cy-imageY*scale;
   clampPan();apply();
 }
 img.addEventListener('load',fit); if(img.complete)fit();
 document.getElementById('zoomIn').onclick=()=>setScale(scale*1.25);
 document.getElementById('zoomOut').onclick=()=>setScale(scale/1.25);
 document.getElementById('fitMap').onclick=fit;
 document.getElementById('actualMap').onclick=()=>{scale=1;x=(viewport.clientWidth-img.naturalWidth)/2;y=(viewport.clientHeight-img.naturalHeight)/2;clampPan();apply()};
 viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();setScale(scale*(e.deltaY<0?1.12:1/1.12),e.clientX-r.left,e.clientY-r.top)},{passive:false});
 viewport.addEventListener('pointerdown',e=>{drag=true;viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId);startX=e.clientX;startY=e.clientY;startPanX=x;startPanY=y});
 viewport.addEventListener('pointermove',e=>{if(!drag)return;x=startPanX+(e.clientX-startX);y=startPanY+(e.clientY-startY);clampPan();apply()});
 function stop(){drag=false;viewport.classList.remove('dragging')}
 viewport.addEventListener('pointerup',stop);viewport.addEventListener('pointercancel',stop);
 window.addEventListener('resize',fit);
})();
</script>
<script src="site-shell.js"></script>
</body>
</html>
