<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Specialist Editor | SCAVLAND</title><link rel="stylesheet" href="site-theme.css"><style>
body.embed .scav-site-header,body.embed .scav-site-nav{display:none!important}.main{width:min(1200px,calc(100% - 28px));margin:24px auto}.layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.panel{background:var(--scav-panel);border:1px solid var(--scav-line);border-radius:6px;padding:16px}.list{max-height:720px;overflow:auto}.choice{display:block;width:100%;text-align:left;padding:9px;background:transparent;color:#eee;border:0;border-bottom:1px solid #343632;cursor:pointer}.choice.active,.choice:hover{background:#302915;color:var(--scav-gold-bright)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.field{display:grid;gap:5px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;background:#111412;color:#eee;border:1px solid #484b45;border-radius:4px}.btn{padding:9px 13px;border:1px solid var(--scav-gold-bright);background:#171713;color:var(--scav-gold-bright);border-radius:4px;cursor:pointer}.btn:disabled{opacity:.45}.status{color:var(--scav-muted);white-space:pre-wrap}.live-record-preview{grid-column:1/-1;padding:14px;border:1px solid var(--scav-line);border-radius:6px;background:#111;color:#e8e5dc}.live-record-preview h2{margin:0 0 6px;color:var(--scav-gold-bright)}.live-record-preview dl{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:0;font-size:14px}.live-record-preview dt{color:#aaa}.live-record-preview dd{margin:0;overflow-wrap:anywhere}.live-record-preview img{display:block;max-width:220px;max-height:150px;object-fit:contain;margin:8px 0;background:#090a09;border:1px solid #343632}@media(max-width:760px){.layout,.grid{grid-template-columns:1fr}.live-record-preview dl{grid-template-columns:1fr}}
</style></head><body><main class="main"><section class="layout"><aside class="panel"><strong id="list-title">Records</strong><input id="search" type="search" placeholder="Search" autocomplete="off"><p id="count" class="status"></p><div id="list" class="list"></div></aside><section class="panel"><h1 id="title">Select a record</h1><p id="status" class="status">Choose a record to edit.</p><div id="editor" class="grid hidden"></div></section></section></main><script>
const SB='https://demtoqsafufzmnhvaykj.supabase.co',KEY='sb_publishable_0kdLCpTy7Sf8BKkIU5TOqw_Qaay4gzH',URL=SB+'/functions/v1/publish-specialist',params=new URLSearchParams(location.search),kind=params.get('type')||'weapons';
const configs={weapons:{label:'Weapons',file:'data/weapons.json',fields:[['category','Category'],['tier','Tier'],['ammo','Ammo'],['damage','Damage','number'],['rpm','RPM','number'],['range','Range','number'],['accuracy','Accuracy','number'],['recoil','Recoil','number'],['handling','Handling','number'],['ergonomics','Ergonomics','number'],['reload','Reload','number'],['image','Image path'],['source','Source JSON','json']]},armour:{label:'Armour',file:'data/armour.json',fields:[['category','Category'],['vendorRank','Vendor rank'],['price','Price','number'],['durability','Durability','number'],['ballistic','Ballistic','number'],['slash','Slash','number'],['radiation','Radiation','number'],['repairClass','Repair class'],['image','Image path'],['description','Description','textarea'],['source','Source JSON','json']]},ammunition:{label:'Ammunition',file:'data/ammo.json',fields:[['category','Category'],['estimatedPrice','Estimated price','number'],['description','Description','textarea'],['damage','Damage'],['penetrationPercent','Penetration percent','number'],['maxStack','Max stack','number'],['source','Source JSON','json']]},crafting:{label:'Crafting',file:'data/crafting.json',fields:[['workbench','Workbench'],['ingredients','Ingredients JSON','json'],['source','Source JSON','json']]}};
const config=configs[kind]||configs.weapons,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let token='',records=[],selected=null,original=null,changes=null;
async function api(path,opt={}){return fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+(opt.auth||KEY),'Content-Type':'application/json',...(opt.headers||{})}})}
async function enter(candidate){const r=await api('/rest/v1/rpc/is_scavland_admin',{method:'POST',auth:candidate,body:'{}'});if(!r.ok||await r.json()!==true)return false;token=candidate;const payload=await fetch(config.file,{cache:'no-store'}).then(r=>r.json());records=payload.data||payload;renderList();return true}
function renderList(){const q=$('search').value.trim().toLowerCase(),rows=records.filter(x=>String(x.name).toLowerCase().includes(q)||x.id.toLowerCase().includes(q));$('list-title').textContent=config.label+' records';$('count').textContent=rows.length+' records';$('list').innerHTML=rows.map(x=>'<button class="choice '+(selected?.id===x.id?'active':'')+'" data-id="'+esc(x.id)+'">'+esc(x.name)+'<br><small>'+esc(x.id)+'</small></button>').join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(b.dataset.id))}
function inputFor(key,label,type,value){const tag=type==='textarea'||type==='json'?'textarea':'input',attrs=type==='number'?' type="number" step="any"':type==='json'?' rows="8"':' type="text"';return '<label class="field '+(tag==='textarea'?'wide':'')+'"><b>'+label+'</b><'+tag+' id="field-'+key+'"'+attrs+'>'+esc(type==='json'?JSON.stringify(value??null,null,2):value??'')+'</'+tag+'></label>'}
function pick(id){selected=records.find(x=>x.id===id);original=structuredClone(selected);changes=null;$('title').textContent='Editing '+selected.name;$('status').textContent='Changes are reviewed before publishing.';let html='<div id="live-record-preview" class="live-record-preview"><h2>'+esc(selected.name)+'</h2><dl></dl></div>';html+=inputFor('name','Name','text',selected.name);for(const [key,label,type] of config.fields)html+=inputFor(key,label,type,selected[key]);html+='<div class="wide"><button id="validate" class="btn" type="button">Validate changes</button> <button id="publish" class="btn" type="button" disabled>Publish to GitHub</button><p id="message" class="status"></p></div>';$('editor').innerHTML=html;$('editor').classList.remove('hidden');$('validate').onclick=validate;$('publish').onclick=publish;document.querySelectorAll('#editor input,#editor select,#editor textarea').forEach(input=>input.addEventListener('input',renderPreview));renderPreview();renderList()}
function renderPreview(){const preview=$('live-record-preview');if(!preview)return;let values;try{values=collect()}catch{values={name:$('field-name')?.value||selected.name}};preview.querySelector('h2').textContent=values.name||selected.name;const image=values.image&&validPath(values.image)?'<img src="'+esc(values.image)+'" alt="Preview">':'';const rows=Object.entries(values).filter(([key,value])=>key!=='name'&&key!=='image'&&value!==null&&value!=='').slice(0,10);preview.querySelector('dl').innerHTML=image+rows.map(([key,value])=>'<dt>'+esc(key)+'</dt><dd>'+esc(typeof value==='object'?JSON.stringify(value):value)+'</dd>').join('')}
function collect(){const next={};for(const [key,,type] of [['name','Name','text'],...config.fields]){const raw=$('field-'+key).value.trim();if(type==='number')next[key]=raw===''?null:Number(raw);else if(type==='json')next[key]=raw?JSON.parse(raw):null;else next[key]=raw||null}return next}
function validPath(value){return typeof value==='string'&&/^(images|evidence-inbox)\/(?:[A-Za-z0-9._ ()-]+\/)*[A-Za-z0-9._ ()-]+\.(png|jpe?g|webp)$/i.test(value)&&!value.includes('..')}
function validate(){try{const next=collect();if(!next.name)throw new Error('Name is required.');for(const [key,,type] of config.fields){if(type==='number'&&next[key]!==null&&(!Number.isFinite(next[key])||next[key]<0))throw new Error(key+' must be a non-negative number.');if(key==='image'&&next[key]&&!validPath(next[key]))throw new Error('Image path must be an existing repository image path.')}changes=Object.fromEntries(Object.entries(next).filter(([key,value])=>JSON.stringify(value)!==JSON.stringify(original[key])));if(!Object.keys(changes).length)throw new Error('There are no changes to publish.');$('message').textContent='Ready: '+Object.keys(changes).join(', ');$('publish').disabled=false}catch(error){changes=null;$('publish').disabled=true;$('message').textContent=error.message}}
async function publish(){if(!changes)return;$('publish').disabled=true;$('message').textContent='Publishing to GitHub...';const r=await fetch(URL,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({kind,id:selected.id,changes})});const d=await r.json().catch(()=>({}));if(!r.ok){$('message').textContent=d.error||'Publish failed.';$('publish').disabled=false;return}$('message').innerHTML='Published. GitHub Pages will update shortly. '+(d.commitUrl?'<a href="'+esc(d.commitUrl)+'" target="_blank">View commit</a>':'')}
$('search').oninput=renderList;window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.data?.type!=='scavland-admin-token'||typeof e.data.token!=='string')return;if(!await enter(e.data.token))$('status').textContent='The parent admin session is not authorized.'});if(!params.has('embed'))$('status').textContent='Open this screen from the main admin hub.';
</script><script>if(window.parent!==window)window.parent.postMessage({type:'scavland-admin-ready'},location.origin);</script></body></html>
