body.embed .scav-site-header,body.embed .scav-site-nav{display:none!important}.main{width:min(1120px,calc(100% - 28px));margin:24px auto}.panel{padding:18px;background:var(--scav-panel);border:1px solid var(--scav-line);border-radius:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;font-weight:700}.wide{grid-column:1/-1}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;background:#111412;color:#eee;border:1px solid #484b45;border-radius:4px}input[type=color]{height:42px;padding:3px}input[type=range]{padding:0;accent-color:var(--scav-gold-bright)}.btn{padding:9px 13px;border:1px solid var(--scav-gold-bright);background:#171713;color:var(--scav-gold-bright);border-radius:4px;cursor:pointer}.btn:disabled{opacity:.45}.status{color:var(--scav-muted);white-space:pre-wrap}.preview{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--scav-line);border-radius:6px;background:#111}.swatch{width:34px;height:34px;border:1px solid #777;border-radius:4px}.live-preview{min-height:220px;padding:18px;border:1px solid var(--scav-line);border-radius:6px;background:var(--preview-panel,#141615);color:var(--preview-text,#e8e5dc);background-size:cover;background-position:center}.live-preview nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:24px}.live-preview nav span{padding:6px 9px;border-radius:var(--preview-radius,6px);background:var(--preview-accent,#ffcc66);color:#171713;font-size:.8em}.live-preview h2{margin:0 0 8px;color:var(--preview-accent,#ffcc66)}.drop-zone{padding:10px;border:1px dashed #777;border-radius:5px}.drop-zone.drag{border-color:var(--scav-gold-bright);background:#302915}.drop-preview{display:block;max-width:180px;max-height:80px;object-fit:contain;margin-top:8px}.help{font-size:12px;color:var(--scav-muted);font-weight:400}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}

</style></head><body><main class="main"><section class="panel"><h1>Page Settings</h1><p>Customize the shared public theme or one page. Images must already exist in the repository.</p><div class="grid"><label class="wide">Apply to<select id="scope"><option value="global">Whole website</option><option value="index.html">Home</option><option value="vendors.html">Vendors</option><option value="weapons.html">Weapons</option><option value="armour.html">Armour</option><option value="crafting.html">Crafting</option><option value="map.html">Map</option><option value="items.html">Items</option><option value="factions.html">Factions</option><option value="areas.html">Areas</option><option value="roadmap.html">Roadmap</option></select></label><label>Background image<input id="backgroundImage" placeholder="images/backgrounds/example.png"><span class="help">Repository-relative PNG, JPG or WebP path.</span></label><label>Header image<input id="headerImage" placeholder="images/example.png"><span class="help">Repository-relative PNG, JPG or WebP path.</span></label><label class="wide">Header subtitle<input id="subtitle" maxlength="100"><span class="help">The small text under the SCAVLAND logo.</span></label><label>Font family<select id="fontFamily"><option value="Arial, Helvetica, sans-serif">Arial</option><option value="Georgia, serif">Georgia</option><option value="Trebuchet MS, sans-serif">Trebuchet MS</option><option value="Verdana, sans-serif">Verdana</option><option value="Courier New, monospace">Courier New</option></select></label><label>Base text size<select id="fontSize"><option>14px</option><option>15px</option><option>16px</option><option>17px</option><option>18px</option><option>20px</option></select></label><label>Accent color<input id="accentColor" type="color"><span class="help">Headings, active navigation, and highlights.</span></label><label>Text color<input id="textColor" type="color"><span class="help">Main public text color.</span></label><label>Panel color<input id="panelColor" type="color"><span class="help">Cards, panels, and vendor sections.</span></label><label>Navigation color<input id="navColor" type="color"><span class="help">Top navigation background.</span></label><label>Corner radius<select id="radius"><option>0px</option><option>2px</option><option>4px</option><option>6px</option><option>8px</option><option>12px</option></select></label><div class="preview wide"><span id="swatch" class="swatch"></span><span>Preview theme colors here, then validate before publishing.</span></div><div class="wide"><button id="validate" class="btn" type="button">Validate changes</button> <button id="publish" class="btn" type="button" disabled>Publish to GitHub</button><p id="message" class="status"></p></div></div></section></main><script>
const SB='https://demtoqsafufzmnhvaykj.supabase.co',KEY='sb_publishable_0kdLCpTy7Sf8BKkIU5TOqw_Qaay4gzH',$=id=>document.getElementById(id),ids=['backgroundImage','headerImage','subtitle','fontFamily','fontSize','accentColor','textColor','panelColor','navColor','radius','pageTitle','pageIntro','footerText','navLabels'];let token='',documentData,changes=null;
const textControls='<label class="wide">Public page title<input id="pageTitle" maxlength="200"></label><label class="wide">Public intro text<input id="pageIntro" maxlength="200"></label><label class="wide">Footer text<input id="footerText" maxlength="200"></label><label class="wide">Navigation labels JSON<textarea id="navLabels" rows="5" placeholder="{&quot;items.html&quot;:&quot;Items&quot;}"></textarea><span class="help">Optional labels by page filename.</span></label>';document.querySelector('.grid').insertAdjacentHTML('afterbegin',textControls+'<div id="live-preview" class="live-preview wide"><nav><span>Home</span><span>Items</span><span>Vendors</span></nav><h2>Live public preview</h2><p>Change the controls to preview the public style.</p><p id="current-public" class="help">Loading current public content...</p></div>');
['backgroundImage','headerImage'].forEach(id=>{const input=$(id),zone=document.createElement('div');zone.className='drop-zone';input.parentNode.insertBefore(zone,input);zone.appendChild(input);const note=document.createElement('span');note.className='help';note.textContent='Drop an image for local preview; enter its repository path to publish.';zone.appendChild(note);zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag')});zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag');const file=e.dataTransfer.files[0];if(!file||!file.type.startsWith('image/'))return;let img=zone.querySelector('.drop-preview');if(!img){img=document.createElement('img');img.className='drop-preview';zone.appendChild(img)}img.src=URL.createObjectURL(file);$('message').textContent='Local preview loaded. Enter the repository path before publishing.'})});
const slider=document.createElement('label');slider.innerHTML='<b>Text size fine control</b><input id="fontSizeRange" type="range" min="12" max="28" step="1"><output id="fontSizeValue"></output>';document.querySelector('#fontSize').parentNode.after(slider);for(let n=12;n<=28;n++){if(![...$('fontSize').options].some(o=>o.value===n+'px'))$('fontSize').add(new Option(n+'px',n+'px'))}$('accentColor').value='#ffcc66';$('textColor').value='#e8e5dc';$('panelColor').value='#141615';$('navColor').value='#0c0e0d';$('radius').value='6px';$('fontSize').value='16px';const previewButton=document.createElement('button');previewButton.id='full-preview';previewButton.className='btn';previewButton.type='button';previewButton.textContent='Open full-page preview';document.querySelector('#validate').before(previewButton);const clearPreview=document.createElement('button');clearPreview.id='clear-preview';clearPreview.className='btn';clearPreview.type='button';clearPreview.textContent='Clear temporary previews';document.querySelector('#validate').before(clearPreview);clearPreview.onclick=()=>{['scavland-admin-preview','scavland-item-preview','scavland-vendor-preview','scavland-specialist-preview'].forEach(key=>localStorage.removeItem(key));$('message').textContent='Temporary previews cleared from this browser.'};
async function load(){documentData=await fetch('data/site-settings.json',{cache:'no-store'}).then(r=>r.json());read();$('message').textContent='Choose settings and validate before publishing.'}
function read(){if(!documentData)return;const page=$('scope').value,values=page==='global'?documentData.global:{...documentData.global,...(documentData.pages[page]||{})},defaults={accentColor:'#ffcc66',textColor:'#e8e5dc',panelColor:'#141615',navColor:'#0c0e0d',radius:'6px',fontSize:'16px'};for(const id of ids)$(id).value=values[id]||defaults[id]||'';syncSlider();updateSwatch();loadCurrentPublic(page==='global'?'index.html':page)}
async function loadCurrentPublic(page){try{const html=await fetch(page,{cache:'no-store'}).then(r=>r.text()),doc=new DOMParser().parseFromString(html,'text/html'),title=doc.querySelector('.hero h1,main h1,body>h1')?.textContent.trim()||'(no heading found)',intro=doc.querySelector('.hero p,main>section>p,main>p')?.textContent.trim()||'(no intro found)';$('current-public').textContent='Current public page: '+title+' — '+intro}catch{$('current-public').textContent='Current public content could not be loaded in this preview.'}}
function current(){const values={};for(const id of ids){const value=$(id).value.trim();if(!value)continue;if(id==='navLabels'){try{values[id]=JSON.parse(value)}catch{throw new Error('Navigation labels must be valid JSON.')}}else values[id]=value}return values}
function syncSlider(){$('fontSizeRange').value=parseInt($('fontSize').value,10)||16;$('fontSizeValue').value=$('fontSizeRange').value+'px'}
function updateSwatch(){const accent=$('accentColor').value||'#ffcc66',panel=$('panelColor').value||'#141615',text=$('textColor').value||'#e8e5dc',radius=$('radius').value||'6px';$('swatch').style.background='linear-gradient(135deg,'+accent+','+panel+')';const preview=$('live-preview');preview.style.setProperty('--preview-accent',accent);preview.style.setProperty('--preview-panel',panel);preview.style.setProperty('--preview-text',text);preview.style.setProperty('--preview-radius',radius);preview.style.fontFamily=$('fontFamily').value;preview.style.fontSize=$('fontSize').value;preview.querySelector('h2').textContent=$('pageTitle').value||'Live public preview';preview.querySelector('p').textContent=$('pageIntro').value||'Change the controls to preview the public style.';$('fontSizeValue').value=$('fontSizeRange').value+'px'}
function validImage(value){return !value||/^(images|evidence-inbox)\/(?:[A-Za-z0-9._ ()-]+\/)*[A-Za-z0-9._ ()-]+\.(png|jpe?g|webp)$/i.test(value)&&!value.includes('..')}
function validate(){try{const settings=current();if(!Object.keys(settings).length)throw new Error('Enter at least one setting.');if(!validImage(settings.backgroundImage)||!validImage(settings.headerImage))throw new Error('Image paths must use images/ or evidence-inbox/ and a supported extension.');if(settings.subtitle&&settings.subtitle.length>100)throw new Error('Subtitle must be 100 characters or fewer.');changes=settings;$('publish').disabled=false;$('message').textContent='Ready to publish: '+Object.keys(settings).join(', ')}catch(error){changes=null;$('publish').disabled=true;$('message').textContent=error.message}}
async function publish(){if(!changes)return;$('publish').disabled=true;$('message').textContent='Publishing...';const r=await fetch(SB+'/functions/v1/publish-site-settings',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({scope:$('scope').value,settings:changes})}),d=await r.json().catch(()=>({}));$('message').innerHTML=r.ok?'Published. GitHub Pages will update shortly. '+(d.commitUrl?'<a href="'+d.commitUrl+'" target="_blank">View commit</a>':''):'Could not publish: '+(d.error||'Unknown error');if(!r.ok)$('publish').disabled=false}
$('scope').onchange=read;ids.forEach(id=>$(id).oninput=updateSwatch);$('fontSizeRange').oninput=()=>{$('fontSize').value=$('fontSizeRange').value+'px';updateSwatch()};$('validate').onclick=validate;$('publish').onclick=publish;$('full-preview').onclick=()=>{try{localStorage.setItem('scavland-admin-preview',JSON.stringify(current()));const page=$('scope').value==='global'?'index.html':$('scope').value;window.open(page+'?adminPreview=1','_blank','noopener')}catch(error){$('message').textContent=error.message}};updateSwatch();window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.data?.type!=='scavland-admin-token'||typeof e.data.token!=='string')return;token=e.data.token;await load()});if(!new URLSearchParams(location.search).has('embed'))$('message').textContent='Open this screen from the main admin hub.';
</script><script>if(window.parent!==window)window.parent.postMessage({type:'scavland-admin-ready'},location.origin);</script></body></html>
