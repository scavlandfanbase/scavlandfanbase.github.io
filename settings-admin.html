<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page Settings | SCAVLAND</title><link rel="stylesheet" href="site-theme.css"><style>
body.embed .scav-site-header,body.embed .scav-site-nav{display:none!important}.main{width:min(900px,calc(100% - 28px));margin:24px auto}.panel{padding:18px;background:var(--scav-panel);border:1px solid var(--scav-line);border-radius:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;font-weight:700}.wide{grid-column:1/-1}input,select{box-sizing:border-box;width:100%;padding:10px;background:#111412;color:#eee;border:1px solid #484b45;border-radius:4px}input[type=color]{height:42px;padding:3px}.btn{padding:9px 13px;border:1px solid var(--scav-gold-bright);background:#171713;color:var(--scav-gold-bright);border-radius:4px;cursor:pointer}.btn:disabled{opacity:.45}.status{color:var(--scav-muted);white-space:pre-wrap}.preview{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--scav-line);border-radius:6px;background:#111}.swatch{width:34px;height:34px;border:1px solid #777;border-radius:4px}.help{font-size:12px;color:var(--scav-muted);font-weight:400}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="main"><section class="panel"><h1>Page Settings</h1><p>Customize the shared public theme or one page. Images must already exist in the repository.</p><div class="grid"><label class="wide">Apply to<select id="scope"><option value="global">Whole website</option><option value="index.html">Home</option><option value="vendors.html">Vendors</option><option value="weapons.html">Weapons</option><option value="armour.html">Armour</option><option value="crafting.html">Crafting</option><option value="map.html">Map</option><option value="items.html">Items</option><option value="factions.html">Factions</option><option value="areas.html">Areas</option><option value="roadmap.html">Roadmap</option></select></label><label>Background image<input id="backgroundImage" placeholder="images/backgrounds/example.png"><span class="help">Repository-relative PNG, JPG or WebP path.</span></label><label>Header image<input id="headerImage" placeholder="images/example.png"><span class="help">Repository-relative PNG, JPG or WebP path.</span></label><label class="wide">Header subtitle<input id="subtitle" maxlength="100"><span class="help">The small text under the SCAVLAND logo.</span></label><label>Font family<select id="fontFamily"><option value="Arial, Helvetica, sans-serif">Arial</option><option value="Georgia, serif">Georgia</option><option value="Trebuchet MS, sans-serif">Trebuchet MS</option><option value="Verdana, sans-serif">Verdana</option><option value="Courier New, monospace">Courier New</option></select></label><label>Base text size<select id="fontSize"><option>14px</option><option>15px</option><option>16px</option><option>17px</option><option>18px</option><option>20px</option></select></label><label>Accent color<input id="accentColor" type="color"><span class="help">Headings, active navigation, and highlights.</span></label><label>Text color<input id="textColor" type="color"><span class="help">Main public text color.</span></label><label>Panel color<input id="panelColor" type="color"><span class="help">Cards, panels, and vendor sections.</span></label><label>Navigation color<input id="navColor" type="color"><span class="help">Top navigation background.</span></label><label>Corner radius<select id="radius"><option>0px</option><option>2px</option><option>4px</option><option>6px</option><option>8px</option><option>12px</option></select></label><div class="preview wide"><span id="swatch" class="swatch"></span><span>Preview theme colors here, then validate before publishing.</span></div><div class="wide"><button id="validate" class="btn" type="button">Validate changes</button> <button id="publish" class="btn" type="button" disabled>Publish to GitHub</button><p id="message" class="status"></p></div></div></section></main><script>
const SB='https://demtoqsafufzmnhvaykj.supabase.co',KEY='sb_publishable_0kdLCpTy7Sf8BKkIU5TOqw_Qaay4gzH',$=id=>document.getElementById(id),ids=['backgroundImage','headerImage','subtitle','fontFamily','fontSize','accentColor','textColor','panelColor','navColor','radius'];let token='',documentData,changes=null;
async function load(){documentData=await fetch('data/site-settings.json',{cache:'no-store'}).then(r=>r.json());read();$('message').textContent='Choose settings and validate before publishing.'}
function read(){const page=$('scope').value,values=page==='global'?documentData.global:{...documentData.global,...(documentData.pages[page]||{})};for(const id of ids)$(id).value=values[id]||'';updateSwatch()}
function current(){const values={};for(const id of ids){const value=$(id).value.trim();if(value)values[id]=value}return values}
function updateSwatch(){$('swatch').style.background='linear-gradient(135deg,'+($('accentColor').value||'#ffcc66')+','+($('panelColor').value||'#141615')+')'}
function validImage(value){return !value||/^(images|evidence-inbox)\/(?:[A-Za-z0-9._ ()-]+\/)*[A-Za-z0-9._ ()-]+\.(png|jpe?g|webp)$/i.test(value)&&!value.includes('..')}
function validate(){try{const settings=current();if(!Object.keys(settings).length)throw new Error('Enter at least one setting.');if(!validImage(settings.backgroundImage)||!validImage(settings.headerImage))throw new Error('Image paths must use images/ or evidence-inbox/ and a supported extension.');if(settings.subtitle&&settings.subtitle.length>100)throw new Error('Subtitle must be 100 characters or fewer.');changes=settings;$('publish').disabled=false;$('message').textContent='Ready to publish: '+Object.keys(settings).join(', ')}catch(error){changes=null;$('publish').disabled=true;$('message').textContent=error.message}}
async function publish(){if(!changes)return;$('publish').disabled=true;$('message').textContent='Publishing...';const r=await fetch(SB+'/functions/v1/publish-site-settings',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({scope:$('scope').value,settings:changes})}),d=await r.json().catch(()=>({}));$('message').innerHTML=r.ok?'Published. GitHub Pages will update shortly. '+(d.commitUrl?'<a href="'+d.commitUrl+'" target="_blank">View commit</a>':''):'Could not publish: '+(d.error||'Unknown error');if(!r.ok)$('publish').disabled=false}
$('scope').onchange=read;ids.forEach(id=>$(id).oninput=updateSwatch);$('validate').onclick=validate;$('publish').onclick=publish;window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.data?.type!=='scavland-admin-token'||typeof e.data.token!=='string')return;token=e.data.token;await load()});if(!new URLSearchParams(location.search).has('embed'))$('message').textContent='Open this screen from the main admin hub.';
</script><script>if(window.parent!==window)window.parent.postMessage({type:'scavland-admin-ready'},location.origin);</script></body></html>
