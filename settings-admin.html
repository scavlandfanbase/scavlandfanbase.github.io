<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="site-theme.css"><style>body.embed .scav-site-header,body.embed .scav-site-nav{display:none}.main{width:min(820px,calc(100% - 28px));margin:24px auto}.panel{padding:18px;background:var(--scav-panel);border:1px solid var(--scav-line);border-radius:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:grid;gap:5px;font-weight:700}input,select{padding:10px;background:#111412;color:#eee;border:1px solid #484b45;border-radius:4px}.btn{padding:9px 13px;border:1px solid var(--scav-gold-bright);background:#171713;color:var(--scav-gold-bright);border-radius:4px;cursor:pointer}.status{color:var(--scav-muted);white-space:pre-wrap}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="main"><section class="panel"><h1>Page settings</h1><p>Choose the whole website or one page. Images must already exist in the repository.</p><div class="grid"><label class="wide">Apply to<select id="scope"><option value="global">Whole website</option><option value="index.html">Home</option><option value="vendors.html">Vendors</option><option value="weapons.html">Weapons</option><option value="armour.html">Armour</option><option value="crafting.html">Crafting</option><option value="map.html">Map</option><option value="items.html">Items</option><option value="factions.html">Factions</option><option value="areas.html">Areas</option><option value="roadmap.html">Roadmap</option></select></label><label>Background image<input id="backgroundImage" placeholder="images/backgrounds/example.png"></label><label>Header image<input id="headerImage" placeholder="images/example.png"></label><label>Header subtitle<input id="subtitle" maxlength="100"></label><label>Text size<select id="fontSize"><option>14px</option><option>15px</option><option selected>16px</option><option>17px</option><option>18px</option><option>20px</option></select></label><label class="wide">Font family<input id="fontFamily" placeholder="Arial, Helvetica, sans-serif"></label><div class="wide"><button id="validate" class="btn">Validate changes</button> <button id="publish" class="btn" disabled>Publish to GitHub</button><p id="message" class="status">Loading settings…</p></div></div></section></main><script>
const SB='https://demtoqsafufzmnhvaykj.supabase.co',KEY='sb_publishable_0kdLCpTy7Sf8BKkIU5TOqw_Qaay4gzH',$=id=>document.getElementById(id);let token='',documentData,changes=null;async function load(){documentData=await fetch('data/site-settings.json',{cache:'no-store'}).then(r=>r.json());read();$('message').textContent='Choose settings and validate before publishing.'}function read(){const x=$('scope').value==='global'?documentData.global:(documentData.pages[$('scope').value]||{});for(const id of ['backgroundImage','headerImage','subtitle','fontFamily','fontSize'])$(id).value=x[id]||''}function validate(){const settings={};for(const id of ['backgroundImage','headerImage','subtitle','fontFamily','fontSize'])if($(id).value.trim())settings[id]=$(id).value.trim();if(!Object.keys(settings).length){$('message').textContent='Enter at least one setting.';return}changes=settings;$('publish').disabled=false;$('message').textContent='Ready to publish: '+Object.keys(settings).join(', ')}async function publish(){if(!changes)return;$('publish').disabled=true;$('message').textContent='Publishing…';const r=await fetch(SB+'/functions/v1/publish-site-settings',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({scope:$('scope').value,settings:changes})}),d=await r.json();$('message').innerHTML=r.ok?'Published. GitHub Pages will update shortly.':'Could not publish: '+(d.error||'Unknown error');if(!r.ok)$('publish').disabled=false}window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.data?.type!=='scavland-admin-token')return;token=e.data.token;await load()});$('scope').onchange=read;$('validate').onclick=validate;$('publish').onclick=publish;
</script><script>function read(){const page=$('scope').value;const values=page==='global'?documentData.global:{...documentData.global,...(documentData.pages[page]||{})};for(const id of ['backgroundImage','headerImage','subtitle','fontFamily','fontSize'])$(id).value=values[id]||''}load().catch(()=>{$('message').textContent='Could not load the current settings.'});</script></body></html>
