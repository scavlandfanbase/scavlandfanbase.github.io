  <style>
    /* =========================================================
       SCAVLAND WEAPONS DATABASE
       ========================================================= */

    :root {
      --bg: #090a0b;
      --panel: #111315;
      --panel-light: #17191c;
      --panel-hover: #1c1f22;
      --border: #2d3135;
      --border-light: #3b4045;

      --text: #e8e8e8;
      --muted: #999fa5;

      --yellow: #f0b91c;
      --yellow-light: #ffd45a;

      --scrap: #74787c;
      --basic: #28a86b;
      --advanced: #268be3;
      --expert: #e7a915;

      --danger: #d95757;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, #171717 0, #0b0c0d 35%, #08090a 75%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .site-header {
      background: rgba(8, 9, 10, 0.96);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-inner {
      width: min(1600px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      color: var(--yellow);
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 2px;
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav a {
      color: #c8c8c8;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 6px;
      transition: 0.2s ease;
      font-size: 14px;
    }

    .nav a:hover {
      background: var(--panel-light);
      color: var(--yellow-light);
    }

    /* =========================================================
       PAGE
       ========================================================= */

    .container {
      width: min(1600px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 80px;
    }

    .hero {
      text-align: center;
      padding: 30px 15px 38px;
    }

    .hero h1 {
      margin: 0;
      color: var(--yellow);
      font-size: clamp(30px, 5vw, 52px);
      letter-spacing: 1px;
    }

    .hero p {
      max-width: 750px;
      margin: 12px auto 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .database-count {
      margin-top: 18px;
      color: #d6d6d6;
      font-size: 14px;
    }

    .database-count strong {
      color: var(--yellow-light);
    }

    /* =========================================================
       CONTROLS
       ========================================================= */

    .controls {
      background: rgba(17, 19, 21, 0.95);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 36px;

      display: grid;
      grid-template-columns: minmax(220px, 2fr) repeat(3, minmax(150px, 1fr));
      gap: 12px;
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .control input,
    .control select {
      width: 100%;
      border: 1px solid var(--border-light);
      background: #0d0f10;
      color: var(--text);
      border-radius: 6px;
      padding: 11px 12px;
      outline: none;
    }

    .control input:focus,
    .control select:focus {
      border-color: var(--yellow);
    }

    /* =========================================================
       SECTION TITLES
       ========================================================= */

    .section {
      margin-top: 46px;
      scroll-margin-top: 90px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .section-title h2 {
      color: var(--yellow-light);
      margin: 0;
      font-size: 23px;
    }

    .section-title::after {
      content: "";
      height: 1px;
      background: linear-gradient(90deg, var(--yellow), transparent);
      flex: 1;
    }

    .category-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    /* =========================================================
       WEAPON GRID
       ========================================================= */

    .weapon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .weapon-card {
      position: relative;
      background: linear-gradient(145deg, #17191b, #111315);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 16px;
      overflow: hidden;
      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .weapon-card:hover {
      transform: translateY(-2px);
      border-color: #50555a;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .weapon-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 3px;
      height: 100%;
      background: var(--tier-color);
    }

    .weapon-card[data-tier="Scrap"] {
      --tier-color: var(--scrap);
    }

    .weapon-card[data-tier="Basic"] {
      --tier-color: var(--basic);
    }

    .weapon-card[data-tier="Advanced"] {
      --tier-color: var(--advanced);
    }

    .weapon-card[data-tier="Expert"] {
      --tier-color: var(--expert);
    }

    .weapon-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .weapon-name {
      margin: 0;
      font-size: 17px;
      color: var(--tier-color);
      line-height: 1.2;
    }

    .tier-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 900;
      padding: 4px 7px;
      border-radius: 5px;
      text-transform: uppercase;
      color: white;
      background: var(--tier-color);
    }

    .primary-stats {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .stat-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 4px;
    }

    .stat-label {
      color: var(--muted);
    }

    .stat-value {
      color: #f1f1f1;
      font-weight: 700;
    }

    .ammo-line {
      background: #0d0f10;
      border: 1px solid #26292c;
      border-radius: 5px;
      padding: 8px;
      font-size: 12px;
      margin-bottom: 12px;
      color: var(--muted);
    }

    .ammo-line strong {
      color: var(--yellow-light);
    }

    .stats-button {
      width: 100%;
      border: 1px solid #3a3d40;
      background: #2c2e30;
      color: white;
      border-radius: 5px;
      padding: 9px 10px;
      transition: 0.15s ease;
    }

    .stats-button:hover {
      background: #383b3e;
      border-color: #50555a;
    }

    .full-stats {
      display: none;
      margin-top: 10px;
      background: #0b0d0e;
      border: 1px solid #232629;
      border-radius: 6px;
      padding: 10px;
    }

    .full-stats.open {
      display: grid;
      gap: 6px;
    }

    /* =========================================================
       AMMO
       ========================================================= */

    .ammo-section {
      margin-top: 70px;
      scroll-margin-top: 90px;
    }

    .ammo-category {
      margin-top: 34px;
    }

    .ammo-category h3 {
      color: var(--yellow-light);
      font-size: 19px;
      margin: 0 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .ammo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .ammo-card {
      background: linear-gradient(145deg, #16181a, #101214);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 16px;
    }

    .ammo-card h4 {
      color: var(--yellow-light);
      margin: 0 0 5px;
      font-size: 16px;
    }

    .ammo-price {
      color: var(--yellow);
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .ammo-description {
      color: #b6b8ba;
      line-height: 1.5;
      font-size: 13px;
      min-height: 58px;
    }

    .ammo-stats {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .ammo-stat {
      background: #0c0e0f;
      border: 1px solid #272a2d;
      border-radius: 5px;
      padding: 8px 5px;
      text-align: center;
    }

    .ammo-stat-label {
      display: block;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .ammo-stat-value {
      font-weight: 800;
      font-size: 13px;
      color: white;
    }

    /* =========================================================
       EMPTY SEARCH RESULT
       ========================================================= */

    .empty-message {
      display: none;
      text-align: center;
      padding: 50px 15px;
      color: var(--muted);
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 24px;
      color: #6f7478;
      font-size: 12px;
      background: #08090a;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 0;
      }

      .container {
        width: min(100% - 20px, 1600px);
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .weapon-grid,
      .ammo-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 18px;
      }
    }
  </style>
</head>

  </main>

    /* =========================================================

       ========================================================= */

    function createWeaponCard(weapon) {

      const card = document.createElement("article");

      card.className = "weapon-card";
      card.dataset.tier = weapon.tier;

      card.innerHTML = `
        <div class="weapon-header">
          <h3 class="weapon-name">${weapon.name}</h3>
          <span class="tier-badge">${weapon.tier}</span>
        </div>

        <div class="primary-stats">

          <div class="stat-line">
            <span class="stat-label">Damage</span>
            <span class="stat-value">${weapon.damage}</span>
          </div>

          <div class="stat-line">
            <span class="stat-label">RPM</span>
            <span class="stat-value">${weapon.rpm}</span>
          </div>

          <div class="stat-line">
            <span class="stat-label">Range</span>
            <span class="stat-value">${weapon.range}</span>
          </div>

        </div>

        <div class="ammo-line">
          Ammo: <strong>${weapon.ammo}</strong>
        </div>

        <button
          class="stats-button"
          type="button"
          aria-expanded="false"
        >
          Show Full Stats
        </button>

        <div class="full-stats">

          <div class="stat-line">
            <span class="stat-label">Accuracy</span>
            <span class="stat-value">${weapon.accuracy}</span>
          </div>

          <div class="stat-line">
            <span class="stat-label">Recoil</span>
            <span class="stat-value">${weapon.recoil}</span>
          </div>

          <div class="stat-line">
            <span class="stat-label">Handling</span>
            <span class="stat-value">${weapon.handling}</span>
          </div>

          <div class="stat-line">
            <span class="stat-label">Ergonomics</span>
            <span class="stat-value">${weapon.ergonomics}</span>
          </div>

          <div class="stat-line">
            <span class="stat-label">Reload</span>
            <span class="stat-value">${weapon.reload}</span>
          </div>

        </div>
      `;

      const button = card.querySelector(".stats-button");
      const fullStats = card.querySelector(".full-stats");

      button.addEventListener("click", () => {

        const isOpen = fullStats.classList.toggle("open");

        button.textContent =
          isOpen ? "Hide Full Stats" : "Show Full Stats";

        button.setAttribute(
          "aria-expanded",
          isOpen ? "true" : "false"
        );

      });

      return card;
    }


    /* =========================================================
       RENDER WEAPONS
       ========================================================= */

    function renderWeapons() {

      const search = searchInput.value
        .trim()
        .toLowerCase();

      const selectedCategory = categoryFilter.value;
      const selectedTier = tierFilter.value;
      const selectedAmmo = ammoFilter.value;

      weaponSections.innerHTML = "";

      let visibleWeapons = 0;

      weaponCategories.forEach(category => {

        const filteredWeapons = weapons.filter(weapon => {

          const matchesSearch =
            weapon.name.toLowerCase().includes(search);

          const matchesCategory =
            selectedCategory === "all" ||
            weapon.category === selectedCategory;

          const matchesTier =
            selectedTier === "all" ||
            weapon.tier === selectedTier;

          const matchesAmmo =
            selectedAmmo === "all" ||
            weapon.ammo === selectedAmmo;

          return (
            weapon.category === category &&
            matchesSearch &&
            matchesCategory &&
            matchesTier &&
            matchesAmmo
          );

        });

        if (filteredWeapons.length === 0) {
          return;
        }

        visibleWeapons += filteredWeapons.length;

        const section = document.createElement("section");

        section.className = "section";

        const title = document.createElement("div");

        title.className = "section-title";

        title.innerHTML = `
          <h2>${category}</h2>
          <span class="category-count">
            ${filteredWeapons.length}
            ${filteredWeapons.length === 1 ? "weapon" : "weapons"}
          </span>
        `;

        const grid = document.createElement("div");

        grid.className = "weapon-grid";

        filteredWeapons.forEach(weapon => {
          grid.appendChild(createWeaponCard(weapon));
        });

        section.appendChild(title);
        section.appendChild(grid);

        weaponSections.appendChild(section);

      });

      emptyMessage.style.display =
        visibleWeapons === 0 ? "block" : "none";
    }


    /* =========================================================
       CREATE AMMO CARD
       ========================================================= */

    function createAmmoCard(ammoItem) {

      const card = document.createElement("article");

      card.className = "ammo-card";

      card.innerHTML = `
        <h4>${ammoItem.name}</h4>

        <div class="ammo-price">
          ${ammoItem.price}
        </div>

        <div class="ammo-description">
          ${ammoItem.description}
        </div>

        <div class="ammo-stats">

          <div class="ammo-stat">
            <span class="ammo-stat-label">Damage</span>
            <span class="ammo-stat-value">
              ${ammoItem.damage}

          </div>

          <div class="ammo-stat">
            <span class="ammo-stat-label">Penetration</span>
            <span class="ammo-stat-value">
              ${ammoItem.penetration}
            </span>
          </div>

          <div class="ammo-stat">
            <span class="ammo-stat-label">Max Stack</span>
            <span class="ammo-stat-value">
              ${ammoItem.stacks}
            </span>
          </div>

        </div>
      `;

      return card;
    }


    /* =========================================================
       RENDER AMMO
       ========================================================= */

    function renderAmmo() {

      ammoSections.innerHTML = "";

      ammoCategories.forEach(category => {

        const categoryAmmo =
          ammo.filter(item => item.category === category);

        if (categoryAmmo.length === 0) {
          return;
        }

        const section = document.createElement("section");

        section.className = "ammo-category";

        const heading = document.createElement("h3");

        heading.textContent = category;

        const grid = document.createElement("div");

        grid.className = "ammo-grid";

        categoryAmmo.forEach(ammoItem => {
          grid.appendChild(createAmmoCard(ammoItem));
        });

        section.appendChild(heading);
        section.appendChild(grid);

        ammoSections.appendChild(section);

      });
    }


    /* =========================================================
       FILTER EVENTS
       ========================================================= */

    searchInput.addEventListener(
      "input",
      renderWeapons
    );

    categoryFilter.addEventListener(
      "change",

    );

    tierFilter.addEventListener(

    ammoFilter.addEventListener(

       ========================================================= */

    renderWeapons();
